name: coolify_mobile
description: "Coolify Mobile - manage your Coolify instance on the go."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.0.0
  google_fonts: ^6.0.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.5
  shadcn_ui: ^0.26.0
  lucide_icons_flutter: ">=3.0.0 <4.0.0"
  http: ^1.2.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - lib/assets/
  fonts:
    - family: Geist Sans
      fonts:
        - asset: lib/assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/Geist-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/app-icon.png"

flutter_native_splash:
  color: "#000000"
  image: lib/assets/app-icon.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#000000"
    image: lib/assets/app-icon.png
    icon_background_color: "#000000"
